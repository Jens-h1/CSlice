<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CSlice</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<header>

<div class="logo">
<img src="assets/logo.svg">
CSlice
</div>


<div class="top-buttons">

<button>
Open STL
</button>

<button>
Save Project
</button>

</div>


</header>



<div class="slicer">


<aside class="settings">


<h2>Printer</h2>

<select>
<option>Creality K2 Plus</option>
<option>Bambu Lab X1C</option>
<option>Prusa MK4</option>
</select>



<h2>Filament</h2>

<select>
<option>PLA</option>
<option>PETG</option>
<option>ABS</option>
</select>




<h2>Quality</h2>

<select>
<option>0.20mm Standard</option>
<option>0.12mm High Quality</option>
<option>0.28mm Draft</option>
</select>




<h2>Infill</h2>

<label>
Density:
<span id="infillValue">20%</span>
</label>

<input 
type="range"
id="infillSlider"
min="0"
max="100"
value="20">



<label>
Pattern
</label>

<select>

<option>Gyroid</option>
<option>Grid</option>
<option>Lines</option>
<option>Cubic</option>
<option>Triangles</option>
<option>Honeycomb</option>
<option>Lightning</option>

</select>


<button class="slice">
Slice Plate
</button>



</aside>





<section class="viewer">


<h2>3D Preview</h2>


<div class="model">

</div>



<div class="info">

<p>
No model loaded
</p>

</div>


</section>



</div>




<script src="js/app.js"></script>


</body>

</html>
